[deploy]
startCommand = "sh -lc 'if [ \"${SERVICE_MODE:-web}\" = \"cron-refresh\" ]; then npm run cron:refresh-due; else npm run start -- --hostname 0.0.0.0 --port ${PORT:-3000}; fi'"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 1

[deploy.env]
PLAYWRIGHT_BROWSERS_PATH = "/ms-playwright"
